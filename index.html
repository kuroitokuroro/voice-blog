<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>こえ手帳</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <link rel="icon" type="image/jpeg" href="favicon.jpg" />
  <link rel="apple-touch-icon" href="favicon.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c&family=Noto+Sans+JP:wght@100..900&family=WDXL+Lubrifont+JP+N&family=Zen+Maru+Gothic:wght@500&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="title-row">
    <div class="title-group">
      <h1 class="title">こえ手帳</h1>
    </div>
    <div class="title-actions">
      <button id="helpButton" class="icon-action-button" type="button" aria-label="ヘルプを開く"><span
          class="material-symbols-outlined">help</span></button>

      <a href="https://odaibako.net/u/voice_blog" target="_blank" rel="noopener noreferrer" class="icon-action-button"
        aria-label="お題箱を開く"><span class="material-symbols-outlined">mail</span></a>

      <button id="settingsButton" class="icon-action-button" type="button" aria-label="設定を開く"><span
          class="material-symbols-outlined">settings</span></button>
    </div>
  </div>

  <div id="tabBar" class="tab-bar"></div>

  <section id="diaryPanel" class="panel">
    <div class="common-input-area">
      <textarea id="diaryInput" class="common-input" placeholder="今日のことを書く"></textarea>

      <div class="common-input-actions">
        <button id="diaryAddButton" class="common-add-button" type="button">
          追加
        </button>

        <button id="voiceButton" class="common-voice-button" type="button" aria-label="日記を音声入力">
          <span class="material-symbols-outlined">mic</span>
        </button>
      </div>
    </div>

    <h2 class="diary-heading">今日の日記</h2>
    <div id="todayDiaryList" class="diary-area"></div>

    <div class="past-section">
      <h2 class="diary-heading">過去の日記</h2>
      <div id="dateButtons" class="date-buttons"></div>
      <div id="pastDiaryCalendar" class="habit-calendar"></div>
      <div id="pastDiaryList" class="past-diary-area"></div>
    </div>

    <div class="download-area">
      <select id="monthSelect"></select>
      <button id="downloadButton" class="main-button">txtファイルでダウンロード</button>
      <button id="deleteOldestMonthButton" class="danger-button">一番古い月の日記を消す</button>
    </div>
  </section>

  <section id="goalPanel" class="panel">
    <div class="common-input-area">
      <textarea id="goalInput" class="common-input" placeholder="例：部屋を片付ける"></textarea>

      <div class="common-input-actions">
        <button id="goalAddButton" class="common-add-button" type="button">追加</button>

        <button id="goalVoiceButton" class="common-voice-button" type="button" aria-label="目標を音声入力">
          <span class="material-symbols-outlined">mic</span>
        </button>
      </div>
    </div>

    <div class="goal-title-row">
      <h2>目標</h2>
      <div class="goal-title-actions"><button id="goalColorButton" class="goal-sort-button">色分け</button><button
          id="goalSortButton" class="goal-sort-button">並び替え</button>
        <button id="goalMultiDeleteButton" class="goal-sort-button">複数削除</button>
      </div>
    </div>
    <div id="goalList" class="diary-area"></div>
  </section>

  <section id="habitPanel" class="panel">
    <div id="habitAddArea" class="habit-add-area">
      <input id="habitInput" class="habit-input" type="text" autocomplete="off" placeholder="例：水を飲む / 薬 / 風呂" />
      <button id="habitAddSubmitButton" class="habit-add-submit-button">追加</button>
    </div>

    <h2>習慣</h2>
    <div id="habitList" class="habit-button-list"></div>
    <div id="habitCalendar" class="habit-calendar"></div>
    <div id="habitDangerArea" class="habit-danger-area"></div>
  </section>

  <section id="schedulePanel" class="panel">

    <div class="common-input-area">
      <textarea id="scheduleInput" class="common-input" placeholder="例：6/12 病院"></textarea>

      <div class="common-input-actions">
        <button id="scheduleAddButton" class="common-add-button" type="button">追加</button>

        <button id="scheduleVoiceButton" class="common-voice-button" type="button" aria-label="予定を音声入力"><span
            class="material-symbols-outlined">mic</span></button>
      </div>
    </div>

    <div id="scheduleList" class="diary-area"></div>
    <div id="scheduleDangerArea" class="schedule-danger-area"></div>
  </section>

  <section id="helpPanel" class="panel">
    <br>
    <hr>
    <br>
    <div class="help-section">
      <h3>PCの場合</h3>
      <p>クリックで編集や削除ができます</p>
    </div>

    <div class="help-section">
      <h3>スマホの場合</h3>
      <p>スワイプで編集や削除ができます</p>
    </div>
    <br>
    <hr>
    <br>
    <div class="help-section">
      <h3>日記</h3>
      <p>今日の記録を残せます。</p>
    </div>

    <div class="help-section">
      <h3>目標</h3>
      <p>やりたいことや、日付のない予定を置いておく場所です。</p>
    </div>

    <div class="help-section">
      <h3>習慣</h3>
      <p>続けたいことを登録し、できた日をタップして記録します。</p>
    </div>

    <div class="help-section">
      <h3>予定</h3>
      <p>予定を入力できます。6/12、0612、6月12日 のように行頭に日付を入れると、日付つき予定として登録されます。</p>
    </div>
    <br>
    <hr>
  </section>

  <section id="settingsPanel" class="panel">
    <br>
    <h2>日付の切り替わる時間</h2>
    <input id="dateSwitchFixed" type="radio" name="dateSwitchMode" checked>
    4時で固定（おすすめ）
    <br>
    <input id="dateSwitchCustom" type="radio" name="dateSwitchMode">
    変更する<br>
    <div id="dateSwitchCustomArea">
      <div class="date-switch-current" id="dateSwitchCurrent">現在：4時</div>
      <input id="dateSwitchRange" class="date-switch-range" type="range" min="0" max="6" step="1" value="4">
      <br>
      ※予定タブは0時切り替え固定になります。<br>
    </div>
    <h2>保存と復元</h2>
    <button id="exportBackupButton" class="main-button" type="button">
      バックアップを書き出す
    </button>

    <input id="importBackupInput" type="file" accept="application/json" />
  </section>

  <div class="bottomIconArea"><img src="icon.png" class="bottomIcon" />
  </div>

  <script src="main.js"></script>
</body>

</html>
